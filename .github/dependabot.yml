version: 2

updates:

  - package-ecosystem: "github-actions"

    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "github-actions"

    labels:
      - "dependencies"

  - package-ecosystem: "npm"

    directory: "/"

    schedule:
      interval: "monthly"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "npm"

    labels:
      - "dependencies"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"