name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Gerar páginas e cards de compartilhamento
        run: |
          python -m pip install "Pillow==12.2.0"
          python scripts/compartilhamento.py --url https://emliomago.github.io/Perfil/

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
