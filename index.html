<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Emli O'Mago</title>

    <meta
        name="description"
        content="Portal oficial de Emli O'Mago."
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <link
        rel="icon"
        href="img/icones/favicon.png"
    >

    <link
        rel="stylesheet"
        href="css/base.css"
    >

    <link
        rel="stylesheet"
        href="css/layout.css"
    >

    <link
        rel="stylesheet"
        href="css/componentes.css"
    >

    <link
        rel="stylesheet"
        href="css/paginas.css"
    >
</head>

<body>

    <div id="app">

        <header id="cabecalho">

            <div id="cabecalho-logo"></div>

            <div id="cabecalho-titulo">
                <h1 id="titulo-site"></h1>
                <p id="subtitulo-site"></p>
            </div>

            <div id="cabecalho-acoes"></div>

        </header>

        <nav
            id="barra-navegacao"
            aria-label="Navegação principal"
        >
        </nav>

        <main id="conteudo-principal">

            <aside id="painel-esquerdo">
            </aside>

            <section
                id="conteudo"
                aria-live="polite"
            >
            </section>

            <aside id="painel-direito">
            </aside>

        </main>

        <footer id="rodape">

            <section id="breadcrumbs">
            </section>

            <section id="informacoes-rodape">
            </section>

        </footer>

    </div>

    <section
        id="player-audio"
        aria-label="Player de áudio"
    >

        <div id="player-capa"></div>

        <div id="player-informacoes">

            <div id="player-titulo"></div>

            <div id="player-subtitulo"></div>

        </div>

        <div id="player-controles">
        </div>

        <div id="player-progresso">
        </div>

    </section>

    <noscript>
        Este portal necessita de JavaScript para funcionar corretamente.
    </noscript>

    <script
        type="module"
        src="js/main.js"
    ></script>

</body>
</html>
